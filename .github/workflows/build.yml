name: Build A166M payload

on:
  push:
    branches: [ main, master, a16x-SM-A166M-DZH1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NDK r27c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build
        run: make TARGET=a16x-SM-A166M-DZH1 API=35

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a16x-SM-A166M-DZH1
          path: |
            build/a16x-SM-A166M-DZH1/cve-2026-43499-app.so
            build/a16x-SM-A166M-DZH1/cve-2026-43499-root
